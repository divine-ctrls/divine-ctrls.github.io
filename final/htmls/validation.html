<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>User Information Form</title>
        
    <link rel="stylesheet" href="/styles/validation.css">
        
    </head>
<body>
    <div class="form-container">
        <h2>User Information</h2>
        <form id="userForm" onsubmit="return validateForm(event)">
            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" placeholder="Jenny" required>
                <span id="firstNameError" class="error">Please enter a valid first name.</span>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" placeholder="Smith" required>
                <span id="lastNameError" class="error">Please enter a valid last name.</span>
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" placeholder="123 Main St" required>
                <span id="addressError" class="error">Please enter a valid address.</span>
            </div>
            <div class="form-group">
                <label for="city">Town/City:</label>
                <input type="text" id="city" name="city" placeholder="Townsville City" required>
                <span id="cityError" class="error">Please enter a valid city name.</span>
            </div>
            <div class="form-group">
                <label for="state">State:</label>
                <select id="state" name="state" required>
                    <option value="">Select a state</option>
                </select>
                <span id="stateError" class="error">Please select a state.</span>
            </div>
            <div class="form-group">
                <label for="zip">Zip Code:</label>
                <input type="text" id="zip" name="zip" pattern="\d{5}" title="Five digit zip code" placeholder="01234" required>
                <span id="zipError" class="error">Please enter a valid 5-digit zip code.</span>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="local@domain.tld" required>
                <span id="emailError" class="error">Please enter a valid email address.</span>
            </div>
            <button type="submit">Submit</button>
        </form>
        <div id="successMessage" class="success">Form submitted successfully!</div>
    </div>

</body>
</html>
